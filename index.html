<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pregunta</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 500px;
        margin: 100px auto;
        padding: 0 20px;
        background-color: #f5f5f5;
        color: #333;
        text-align: center;
      }

      h1 {
        font-size: 2rem;
        color: #222;
      }

      p {
        color: #666;
        margin-bottom: 40px;
      }

      .buttons {
        display: flex;
        gap: 20px;
        justify-content: center;
      }

      button {
        padding: 14px 36px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      .yes {
        background-color: #2c7be5;
        color: white;
      }

      .yes:hover { background-color: #1a5cbf; }

      .no {
        background-color: #e0e0e0;
        color: #333;
      }

      .no:hover { background-color: #c8c8c8; }
    </style>
  </head>

  <body>
    <h1>OYE</h1>

    <h2>eres mi bro?</h2>

    <p>Piensa detenidamente tu respuesta.</p>

    <div class="buttons">
      <button class="yes" onclick="answer('yes')">Yes</button>
      <button class="no"  onclick="answer('no')">No</button>
    </div>

    <script>
      function answer(choice) {
        window.location.href = "response.html?answer=" + choice;
      }
    </script>
  </body>
</html>
